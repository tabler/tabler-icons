version: 2
updates:
  - package-ecosystem: npm
    # pnpm workspace root; covers every package.json listed in pnpm-workspace.yaml
    directory: /
    schedule:
      interval: weekly
    # pnpm-workspace.yaml refuses versions published less than 7 days ago
    # (`minimumReleaseAge`), so Dependabot must not propose them either
    cooldown:
      default-days: 7
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'ng-packagr'
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
