name: Build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        name: Install pnpm

      # Only `rsvg-convert` is needed (PNG/PDF/EPS packages and preview images).
      # `canvas` is merely an optional peer dependency of jsdom and is not installed.
      - name: Install rsvg-convert
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          rsvg-convert --version

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Type-check build scripts
        run: pnpm run typecheck:build

      - name: Test build scripts
        run: pnpm run test:build

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Build
        env:
          ICONS_LIMIT: 100
        run: pnpm run build

      - name: Check image packages
        env:
          ICONS_LIMIT: 100
        run: pnpm --filter @tabler/icons-png --filter @tabler/icons-pdf --filter @tabler/icons-eps run check

      # The demo apps in test/test-* have no test script and import icons outside
      # the ICONS_LIMIT subset, so only the packages and the two guard suites are
      # selected. @tabler/icons-angular runs in headless Chrome via Karma, which
      # is preinstalled on the runner.
      - name: Test
        env:
          ICONS_LIMIT: 100
        run: >-
          pnpm exec turbo run test
          --filter='./packages/*'
          --filter=test-react-rsc
          --filter=test-react-types
